<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sketch2DXF - Skizze zu CAD</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .loader {
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-left-color: #3b82f6;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        /* SVG Preview styling to ensure it fits and uses correct colors in darkmode */
        #svgPreview svg {
            width: 100%;
            height: 100%;
            max-height: 400px;
            color: #60a5fa; /* blue-400 */
        }
        #svgPreview svg text {
            fill: #9ca3af !important; /* gray-400 */
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen p-4 md:p-8">

    <div class="max-w-6xl mx-auto flex flex-col gap-8">
        
        <div class="text-center">
            <h1 class="text-4xl font-bold mb-2 text-white tracking-tight">Sketch2DXF</h1>
            <p class="text-gray-400 text-sm">Lade eine Handskizze mit Maßen (mm) hoch. KI erstellt eine 2D DXF – bearbeitbar und bereit zum Download.</p>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 items-start">
            
            <div class="bg-gray-800 p-6 rounded-2xl shadow-xl border border-gray-700 flex flex-col h-full">
                <h2 class="text-xl font-semibold mb-4 flex items-center gap-2">
                    <span class="bg-blue-600 w-8 h-8 rounded-full flex items-center justify-center text-sm">1</span>
                    Skizze hochladen
                </h2>
                
                <div id="dropzone" class="flex-1 border-2 border-dashed border-gray-600 rounded-xl p-6 flex flex-col items-center justify-center cursor-pointer hover:border-blue-500 hover:bg-gray-750 transition relative group overflow-hidden bg-gray-900/50 min-h-[300px]">
                    <input type="file" id="fileInput" accept="image/*" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10" />
                    
                    <div id="placeholder" class="text-center flex flex-col items-center pointer-events-none">
                        <svg class="w-12 h-12 text-gray-500 mb-3 group-hover:text-blue-400 transition" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                        <span class="text-gray-400 font-medium">Foto aufnehmen oder hier ablegen</span>
                    </div>
                    
                    <img id="imagePreview" class="hidden w-full h-full object-contain z-0 pointer-events-none rounded-lg" />
                </div>

                <button id="generateBtn" class="mt-4 w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-xl shadow-lg transition-all disabled:opacity-50 disabled:cursor-not-allowed flex justify-center items-center gap-2" disabled>
                    <span>Skizze analysieren & generieren</span>
                    <div class="loader hidden" id="generateLoader"></div>
                </button>
            </div>

            <div class="bg-gray-800 p-6 rounded-2xl shadow-xl border border-gray-700 flex flex-col h-full opacity-50 transition-opacity duration-300" id="resultPanel">
                <h2 class="text-xl font-semibold mb-4 flex items-center gap-2">
                    <span class="bg-emerald-600 w-8 h-8 rounded-full flex items-center justify-center text-sm">2</span>
                    CAD Vorschau & Maße
                </h2>
                
                <!-- Status Message -->
                <div id="messageArea" class="hidden p-3 mb-4 rounded-xl text-sm font-medium border"></div>

                <!-- Vorschau Container -->
                <div class="bg-gray-900 border border-gray-700 rounded-xl p-4 flex items-center justify-center mb-6 min-h-[300px] relative overflow-hidden">
                    <div id="svgPreview" class="w-full h-full flex items-center justify-center text-gray-500 text-sm">
                        Noch keine Zeichnung generiert.
                    </div>
                    <div id="previewOverlay" class="absolute inset-0 bg-gray-900/80 hidden flex-col items-center justify-center backdrop-blur-sm z-10">
                        <div class="loader mb-2"></div>
                        <span class="text-blue-400 font-medium text-sm">Berechne CAD neu...</span>
                    </div>
                </div>

                <!-- Maße & Controls -->
                <div id="dimensionsPanel" class="hidden flex-col gap-4">
                    <div class="bg-gray-900/50 p-4 rounded-xl border border-gray-700">
                        <h3 class="text-sm font-semibold text-gray-300 mb-3 uppercase tracking-wider">Erkannte Maße (mm)</h3>
                        <div id="dimensionsList" class="grid grid-cols-2 gap-3">
                            <!-- Dynamic inputs will be injected here -->
                        </div>
                    </div>

                    <div class="flex flex-col sm:flex-row gap-3 mt-2">
                        <button id="updateBtn" class="flex-1 bg-gray-700 hover:bg-gray-600 text-white font-semibold py-3 px-4 rounded-xl shadow transition-all flex justify-center items-center gap-2">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                            Zeichnung aktualisieren
                        </button>
                        <a id="downloadBtn" class="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-3 px-4 rounded-xl shadow transition-all flex justify-center items-center gap-2" href="#" download="zeichnung.dxf">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                            DXF Herunterladen
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        "use strict";

        // --- State Management ---
        const State = {
            base64: null,
            mimeType: null,
            dxfUrl: null,
            dimensions: {},
            isProcessing: false
        };

        // --- DOM Elements Cache ---
        const UI = {
            fileInput: document.getElementById('fileInput'),
            imagePreview: document.getElementById('imagePreview'),
            placeholder: document.getElementById('placeholder'),
            generateBtn: document.getElementById('generateBtn'),
            generateLoader: document.getElementById('generateLoader'),
            resultPanel: document.getElementById('resultPanel'),
            messageArea: document.getElementById('messageArea'),
            svgPreview: document.getElementById('svgPreview'),
            previewOverlay: document.getElementById('previewOverlay'),
            dimensionsPanel: document.getElementById('dimensionsPanel'),
            dimensionsList: document.getElementById('dimensionsList'),
            updateBtn: document.getElementById('updateBtn'),
            downloadBtn: document.getElementById('downloadBtn')
        };

        // --- Utility Functions ---
        const cleanupDxfUrl = () => {
            if (State.dxfUrl) {
                URL.revokeObjectURL(State.dxfUrl);
                State.dxfUrl = null;
            }
        };

        const showMessage = (msg, type = 'info') => {
            UI.messageArea.textContent = msg;
            UI.messageArea.classList.remove('hidden');
            UI.messageArea.className = `p-3 mb-4 rounded-xl text-sm font-medium border ${
                type === 'error' ? 'bg-red-900/50 text-red-200 border-red-700' : 'bg-emerald-900/50 text-emerald-200 border-emerald-700'
            }`;
        };

        const resetUI = () => {
            UI.messageArea.classList.add('hidden');
            UI.resultPanel.classList.add('opacity-50');
            UI.dimensionsPanel.classList.add('hidden');
            UI.svgPreview.innerHTML = 'Noch keine Zeichnung generiert.';
            UI.dimensionsList.innerHTML = '';
            State.dimensions = {};
            cleanupDxfUrl();
        };

        // --- API & Core Logic ---
        const buildPrompt = (isUpdate) => {
            let prompt = `Du bist ein hochpräziser CAD-Experte. Analysiere die Handskizze.
Ziel: Erstelle eine 2D ASCII DXF-Datei (R12) UND eine SVG-Vorschau.
Regeln:
1. Erkenne alle geometrischen Formen (Linien, Rechtecke, Kreise, etc.).
2. Lies alle geschriebenen Maße in mm ab. Diese Maße beziehen sich AUSSCHLIESSLICH auf physische Abmessungen (Längen, Breiten, Radien, Abstände).
3. BEZUGSPUNKTE: Achte EXAKT darauf, wo Maßhilfslinien ansetzen. Maße für Bohrungen/Kreise geben fast immer den Abstand von einer Kante zum KREISMITTELPUNKT an, niemals zum Kreisrand. Beachte dies zwingend bei der Koordinatenberechnung in DXF und SVG.
4. 'dxf_content': Erstelle den vollständigen, rohen DXF-Text. Skaliere ALLE Koordinaten exakt maßstabsgetreu.
5. 'svg_content': Erstelle einen reinen <svg ...> String (ohne Markdown, nur das Tag). Nutze viewBox, fill="none". Hauptlinien (Bauteilkanten): stroke="currentColor" und stroke-width="0.4". Hilfs-/Maßlinien ZWINGEND: stroke-width="0.2", stroke="#6b7280", stroke-dasharray="3,3". Zeichne Geometrie, Maßlinien und setze Maße als <text>.
6. 'dimensions': JSON-Array aller Geometrie-Maße z.B. [{"id": "d1", "name": "Abstand links zu Kreismitte", "value": 50}]. Keine Parameter für Optik/Linienstärken!`;

            if (isUpdate && Object.keys(State.dimensions).length > 0) {
                prompt += `\n\nACHTUNG NUTZER-ÜBERSCHREIBUNG: Der Nutzer hat Maße manuell angepasst. Ignoriere die im Bild abgelesenen Werte für folgende IDs und nutze ZWINGEND diese neuen Werte zur Generierung der Skalierung in DXF und SVG:\n${JSON.stringify(State.dimensions)}`;
            } else {
                prompt += `\n6. Falls keine klaren Formen/Maße gefunden werden, setze 'success' auf false und nenne den Grund in 'error_message' auf Deutsch.`;
            }
            return prompt;
        };

        const callAiApi = async (prompt) => {
            const payload = {
                contents: [{
                    role: "user",
                    parts: [
                        { text: prompt },
                        { inlineData: { mimeType: State.mimeType, data: State.base64 } }
                    ]
                }],
                generationConfig: {
                    responseMimeType: "application/json",
                    responseSchema: {
                        type: "OBJECT",
                        properties: {
                            success: { type: "BOOLEAN" },
                            error_message: { type: "STRING" },
                            dxf_content: { type: "STRING" },
                            svg_content: { type: "STRING" },
                            dimensions: {
                                type: "ARRAY",
                                items: {
                                    type: "OBJECT",
                                    properties: {
                                        id: { type: "STRING" },
                                        name: { type: "STRING" },
                                        value: { type: "NUMBER" }
                                    }
                                }
                            }
                        },
                        required: ["success"]
                    }
                }
            };

            const apiKey = ""; // API Key handled by environment
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

            const response = await fetch(apiUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (!response.ok) throw new Error(`API Fehler: ${response.status}`);
            const result = await response.json();
            
            if (result.candidates && result.candidates[0].content.parts[0].text) {
                return JSON.parse(result.candidates[0].content.parts[0].text);
            }
            throw new Error("Unerwartete API-Antwort");
        };

        const processSketch = async (isUpdate = false) => {
            if (!State.base64 || State.isProcessing) return;
            State.isProcessing = true;

            // Update UI to loading state
            if (isUpdate) {
                UI.previewOverlay.classList.remove('hidden');
                UI.updateBtn.disabled = true;
            } else {
                UI.generateBtn.disabled = true;
                UI.generateBtn.querySelector('span').textContent = 'Analysiere Skizze...';
                UI.generateLoader.classList.remove('hidden');
                UI.messageArea.classList.add('hidden');
            }

            try {
                const prompt = buildPrompt(isUpdate);
                const data = await callAiApi(prompt);

                if (data.success && data.dxf_content && data.svg_content) {
                    renderResult(data);
                    showMessage(isUpdate ? "Zeichnung erfolgreich aktualisiert!" : "DXF erfolgreich generiert!", 'success');
                } else {
                    showMessage(data.error_message || "Skizze konnte nicht verarbeitet werden.", 'error');
                }
            } catch (error) {
                showMessage("Fehler bei der Kommunikation mit der KI.", 'error');
                console.error("Prozess-Fehler:", error);
            } finally {
                State.isProcessing = false;
                if (isUpdate) {
                    UI.previewOverlay.classList.add('hidden');
                    UI.updateBtn.disabled = false;
                } else {
                    UI.generateBtn.disabled = false;
                    UI.generateBtn.querySelector('span').textContent = 'Skizze analysieren & generieren';
                    UI.generateLoader.classList.add('hidden');
                }
            }
        };

        const renderResult = (data) => {
            UI.resultPanel.classList.remove('opacity-50');
            UI.dimensionsPanel.classList.remove('hidden');
            UI.dimensionsPanel.classList.add('flex');

            // Render SVG Preview
            UI.svgPreview.innerHTML = data.svg_content.trim();

            // Prepare DXF Download
            cleanupDxfUrl();
            const blob = new Blob([data.dxf_content], { type: 'application/dxf' });
            State.dxfUrl = URL.createObjectURL(blob);
            UI.downloadBtn.href = State.dxfUrl;

            // Render Dimensions Form using mapped template strings
            if (data.dimensions && data.dimensions.length > 0) {
                UI.dimensionsList.innerHTML = data.dimensions.map(dim => {
                    State.dimensions[dim.id] = dim.value; // Store state
                    return `
                        <div class="flex flex-col">
                            <label class="text-xs text-gray-400 mb-1 truncate" title="${dim.name}">${dim.name} (${dim.id})</label>
                            <div class="relative">
                                <input type="number" step="0.1" data-id="${dim.id}" value="${dim.value}" 
                                    class="w-full bg-gray-800 border border-gray-600 rounded-lg py-2 px-3 text-white text-sm focus:border-blue-500 focus:ring-1 focus:ring-blue-500 outline-none transition" />
                                <span class="absolute right-3 top-2 text-xs text-gray-500 pointer-events-none">mm</span>
                            </div>
                        </div>
                    `;
                }).join('');
            } else {
                UI.dimensionsList.innerHTML = '<div class="col-span-2 text-sm text-gray-500 italic">Keine expliziten Maße erkannt.</div>';
            }
        };

        // --- Event Listeners ---
        UI.fileInput.addEventListener('change', (event) => {
            const file = event.target.files[0];
            if (!file) return;

            resetUI();
            
            const reader = new FileReader();
            reader.onload = (e) => {
                UI.imagePreview.src = e.target.result;
                UI.imagePreview.classList.remove('hidden');
                UI.placeholder.classList.add('hidden');
                
                const match = e.target.result.match(/^data:(.+);base64,(.*)$/);
                if (match) {
                    State.mimeType = match[1];
                    State.base64 = match[2];
                    UI.generateBtn.disabled = false;
                }
            };
            reader.readAsDataURL(file);
        });

        // Event Delegation for dynamically created input fields
        UI.dimensionsList.addEventListener('input', (e) => {
            if (e.target.tagName === 'INPUT') {
                const val = parseFloat(e.target.value);
                if (!isNaN(val)) {
                    State.dimensions[e.target.dataset.id] = val;
                }
            }
        });

        UI.generateBtn.addEventListener('click', () => processSketch(false));
        UI.updateBtn.addEventListener('click', () => processSketch(true));
    </script>
</body>
</html>
